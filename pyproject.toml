[project]
name = "pdf-mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0,<2",
    "pdfplumber>=0.11.4",
    "pypdf>=5.1.0",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
]

[project.scripts]
pdf-mcp-server = "pdf_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_mcp_server"]
